 <div class="card shadow-sm rounded">
    <div class="card-body">
      <div class="topeproject">
        <div class="datos ">
          <h5 class="card-title fw-bold text-dark m-0 p-0">{{ project.nombre }}</h5>
        </div>
        <span class="badge bg-primary text-white small">{{ project.empresa }}</span>

      </div>
      
      <div class="mt-3">
        <details>
          <summary class="">Detalles </summary>
          <div class="features small mb-auto">
            <div class="d-flex align-items-center" *ngIf="project.correo">
              <i class="fa fa-envelope"></i>&nbsp; &nbsp;
              <span class="text-secondary">
                {{ project.correo }}
              </span>
            </div>
            <div class="d-flex align-items-center" *ngIf="project.telefono">
              <i class="fa fa-whatsapp"></i>&nbsp; &nbsp;
              <span class="text-secondary">
                {{ project.telefono }}
              </span>
            </div>
          </div>
        </details>
      </div>

      <div class="mt-4 d-flex justify-content-between align-items-center">
        <div class="d-flex gap-1">
          <button href="javascript:void(0)" (click)="openEditModal(project)" data-bs-toggle="modal"
            data-bs-target="#editProject" class="btn btn-outline-primary p-2">
            <i class="fa fa-eye"></i>
          </button>
          <button (click)="deleteProject()" class="btn btn-outline-danger p-2">
            <i class="fa fa-trash"></i>
          </button>
        </div>
      </div>
    </div>
  </div>
